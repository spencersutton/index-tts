dataset:
    bpe_model:
        repo_id: IndexTeam/IndexTTS-2
        filename: bpe.model
    sample_rate: 24000
    squeeze: false
    mel:
        sample_rate: 24000
        hop_length: 256
        win_length: 1024
        n_mels: 100
        mel_fmin: 0
        normalize: false

gpt:
    max_mel_tokens: 1815
    max_text_tokens: 600
    heads: 20
    layers: 24

semantic_codec:
    hidden_size: 1024

s2mel:
    preprocess_params:
        sr: 22050
        spect_params:
            win_length: 1024
            hop_length: 256
            n_mels: 80
            fmin: 0
            fmax: None

    dit_type: DiT
    reg_loss_type: l1
    style_encoder:
        dim: 192
    length_regulator:
        channels: 512
        is_discrete: false
        in_channels: 1024
        content_codebook_size: 2048
        sampling_ratios: [1, 1, 1, 1]
        vector_quantize: false
        n_codebooks: 1
        quantizer_dropout: 0.0
        f0_condition: false
        n_f0_bins: 512
    DiT:
        hidden_dim: 512
        num_heads: 8
        depth: 13
        class_dropout_prob: 0.1
        block_size: 8192
        in_channels: 80
        style_condition: true
        final_layer_type: wavenet
        target: mel
        content_dim: 512
        content_codebook_size: 1024
        content_type: discrete
        f0_condition: false
        n_f0_bins: 512
        content_codebooks: 1
        is_causal: false
        long_skip_connection: true
        zero_prompt_speech_token: false
        time_as_token: false
        style_as_token: false
        uvit_skip_connection: true
        add_resblock_in_transformer: false
    wavenet:
        hidden_dim: 512
        num_layers: 8
        kernel_size: 5
        dilation_rate: 1
        p_dropout: 0.2
        style_condition: true

gpt_checkpoint: checkpoints/gpt.pth
w2v_stat:
    repo_id: amphion/dualcodec
    filename: w2vbert2_mean_var_stats_emilia.pt
s2mel_checkpoint: checkpoints/s2mel_cleaned.pt
emo_matrix: feat2.pt
spk_matrix: feat1.pt
emo_num: [3, 17, 2, 8, 4, 5, 10, 24]
qwen_emo_path: dsinghvi/qwen0.6bemo4-merge
vocoder:
    type: bigvgan
    name: nvidia/bigvgan_v2_22khz_80band_256x
version: 2.0
