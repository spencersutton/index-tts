[project]
name = "indextts"
version = "2.0.0"
description = "IndexTTS2: A Breakthrough in Emotionally Expressive and Duration-Controlled Auto-Regressive Zero-Shot Text-to-Speech"
authors = [{ name = "Bilibili IndexTTS Team" }]
license = "LicenseRef-Bilibili-IndexTTS"
license-files = ["LICEN[CS]E*"]
readme = "README.md"
classifiers = [
  "Development Status :: 5 - Production/Stable",

  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",

  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",

  "Natural Language :: English",
  "Natural Language :: Chinese (Simplified)",

  "Programming Language :: Python :: 3",

  "Operating System :: OS Independent",
]
requires-python = ">=3.14"
dependencies = [
  "accelerate>=1.8.1",
  "beartype>=0.22.9",
  "einops>=0.8.1",
  "pyinstrument>=5.1.2",
  "safetensors>=0.5.2",
  "sentencepiece>=0.2.1",
  "torch[opt-einsum]>=2.10",
  "torchaudio>=2.10",
  "torchcodec>=0.10",
  "tqdm>=4.67.1",
  "transformers>=4.52.1",
  "wetext>=0.0.9; sys_platform != 'linux'",
  "WeTextProcessing; sys_platform == 'linux'",
]

[project.optional-dependencies]
webui = ["gradio>=5.45.0"]

[project.urls]
Homepage = "https://github.com/index-tts/index-tts"
Repository = "https://github.com/index-tts/index-tts.git"

[project.scripts]
indextts = "indextts.cli:main"

[build-system]
requires = ["hatchling >= 1.27.0"]
build-backend = "hatchling.build"

[tool.uv]
override-dependencies = ["pynini>=2.1.7"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
  { index = "pytorch-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cuda"
# Use PyTorch built for NVIDIA Toolkit version 12.8.
# Available versions: https://pytorch.org/get-started/locally/
url = "https://download.pytorch.org/whl/cu128"
# Only use this index when explicitly requested by `tool.uv.sources`.
explicit = true

[tool.ruff]
line-length = 120
preview = true
show-fixes = true
unsafe-fixes = false

[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = true

[tool.ruff.lint]
exclude = ["overrides/**", "tests/**"]
extend-select = [
  "ANN",
  "B",
  "C",
  "FURB",
  "I",
  "PLR1711",
  "PTH",
  "PYI",
  "RET",
  "RUF",
  "SIM",
  "UP",
]
ignore = [
  "ANN401",
  "B008",
  "B028",
  "B901",
  "B905",
  "C901",
  "F722",
  "F821",
  "PYI041",
  "RUF001",
  "RUF002",
  "RUF003",
  "SIM108",
]
isort.split-on-trailing-comma = false

[dependency-groups]
dev = ["mypy>=1.19.1", "pytest>=9.0.2", "pytest-cov>=7.0.0", "rich>=14.1.0"]

[tool.basedpyright]
enableTypeIgnoreComments = true
ignore = ["tools/", "sitecustomize.py"]
reportIgnoreCommentWithoutRule = false
reportUnusedCallResult = false
stubPath = "../typings"

[[tool.basedpyright.executionEnvironments]]
root = "../typings"
reportExplicitAny = false
reportImplicitOverride = false
reportMissingParameterType = false
reportUnknownParameterType = false

[[tool.basedpyright.executionEnvironments]]
root = "BigVGANInference/"
reportAny = false
reportExplicitAny = false
reportImplicitOverride = false
reportIncompatibleUnannotatedOverride = "warning"
reportMissingParameterType = false
reportMissingTypeStubs = false
reportUnannotatedClassAttribute = false
reportUninitializedInstanceVariable = false
reportUnknownArgumentType = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
reportUnreachable = false
